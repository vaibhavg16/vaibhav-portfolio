# Name of the Workflow.
name: Deploy

# When the workflow should run.
on:
  workflow_call:
  # push: whenever code is pushed to GitHub, the workflow automatically runs. 
  # workflow_call: when this workflow needs to be called from another workflow.
  # workflow_dispatch: whenever you want the workflow to be called manually 
  # schedule: whenever you want the workflow to run at a specific time.

# Jobs in workflow. 
jobs:
  code-checkout:
    name: deploy (${{ matrix.runner-type }})
    strategy:
      matrix:
        runner-type: [ubuntu-latest, self-hosted]
    runs-on: ${{ matrix.runner-type }}

    # Steps in workflow.
    steps:
      - name: Clone Code
        uses: actions/checkout@v4
        with:
          # CHANGE 1: download the full git history (not just the latest commit)
          # so we can find out when resume.pdf was last changed.
          fetch-depth: 0

      - name: Ensure Nginx and Deploy
        run: |
          export DEBIAN_FRONTEND=noninteractive

          # Check if Nginx is installed
          if ! command -v nginx &> /dev/null; then
            echo "Nginx not found. Installing..."
            sudo -E apt-get update -y
            sudo -E apt-get install -y nginx
            sudo systemctl enable nginx
            sudo systemctl start nginx
          else
            echo "Nginx is already installed. Skipping installation."
          fi

          # Ensure Nginx service is actively running
          sudo systemctl is-active --quiet nginx || sudo systemctl start nginx || sudo service nginx start

          # CHANGE 2: stamp resume.pdf with the date it was last committed,
          # so the "Last updated" label on the portfolio shows the real resume date.
          if [ -f resume.pdf ]; then
            LAST_CHANGE="$(git log -1 --format=%cI -- resume.pdf)"
            if [ -n "$LAST_CHANGE" ]; then
              touch -d "$LAST_CHANGE" resume.pdf
              echo "resume.pdf last changed: $LAST_CHANGE"
            fi
          else
            echo "WARNING: resume.pdf not found in the repo. The Resume section will show 'coming soon'."
          fi

          # Copy site files using elevated permissions to prevent permission denied errors
          # CHANGE 3: --preserve=timestamps keeps the date from CHANGE 2 on the server copy.
          sudo cp -r --preserve=timestamps ./* /var/www/html/
      
      - name: Deploy the code
        run: echo "Code Deployed successfully"
